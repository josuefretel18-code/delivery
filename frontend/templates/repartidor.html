<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kimbos | Repartidor</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/repartidor.css') }}"
    >

</head>

<body>

    <header class="rep-barra">
        <div>
            <strong>KIMBOS</strong>
            <span>Repartidor</span>
        </div>

        <button
            id="btnSalir"
            class="btn btn-sm btn-outline-light d-none"
            type="button"
        >
            Cerrar sesión
        </button>
    </header>


    <!-- ================= LOGIN ================= -->

    <main id="vistaLogin" class="rep-contenedor">

        <div class="rep-tarjeta">

            <h1 class="h4 fw-bold mb-1">Hola 👋</h1>

            <p class="text-secondary mb-3">
                Ingresa con el correo y la contraseña que te dio el administrador.
            </p>

            <form id="formLogin">

                <label class="form-label fw-semibold" for="correo">Correo</label>
                <input
                    id="correo"
                    type="email"
                    class="form-control form-control-lg mb-3"
                    autocomplete="username"
                    required
                >

                <label class="form-label fw-semibold" for="password">Contraseña</label>
                <input
                    id="password"
                    type="password"
                    class="form-control form-control-lg mb-3"
                    autocomplete="current-password"
                    required
                >

                <div id="errorLogin" class="alert alert-danger py-2 d-none"></div>

                <button class="btn btn-dark btn-lg w-100" type="submit">
                    Ingresar
                </button>

            </form>

        </div>

    </main>


    <!-- ================= PANEL ================= -->

    <main id="vistaPanel" class="rep-contenedor d-none">

        <section class="rep-tarjeta rep-perfil">

            <div>
                <div class="rep-nombre" id="nombreRepartidor">--</div>
                <div class="text-secondary small" id="datosRepartidor">--</div>
            </div>

            <div class="form-check form-switch rep-turno">
                <input
                    id="switchTurno"
                    class="form-check-input"
                    type="checkbox"
                    role="switch"
                >
                <label class="form-check-label fw-semibold" for="switchTurno">
                    En turno
                </label>
            </div>

        </section>

        <details class="rep-tarjeta rep-password">
            <summary>🔑 Cambiar mi contraseña</summary>

            <form id="formMiPassword" class="mt-3">
                <input name="actual" type="password" class="form-control mb-2" placeholder="Contraseña actual" required autocomplete="current-password">
                <input name="nueva" type="password" class="form-control mb-2" placeholder="Nueva contraseña (mínimo 8)" minlength="8" required autocomplete="new-password">
                <input name="confirmar" type="password" class="form-control mb-2" placeholder="Repite la nueva contraseña" minlength="8" required autocomplete="new-password">
                <div id="mensajeMiPassword" class="d-none"></div>
                <button class="btn btn-dark w-100" type="submit">Guardar</button>
            </form>
        </details>

        <section class="rep-resumen">
            <div>
                <span id="numEnCurso">0</span>
                <small>por entregar</small>
            </div>
            <div>
                <span id="numEntregadosHoy">0</span>
                <small>entregados hoy</small>
            </div>
            <div>
                <span id="numATiempoHoy">0</span>
                <small>a tiempo hoy</small>
            </div>
        </section>

        <h2 class="rep-seccion">🛵 Por entregar</h2>
        <div id="listaEnCurso"></div>

        <h2 class="rep-seccion">✅ Entregados hoy</h2>
        <div id="listaEntregados"></div>

        <p class="text-center text-secondary small my-4">
            Se actualiza solo cada 5 segundos ·
            <a href="#" id="btnActualizar">Actualizar ahora</a>
        </p>

    </main>


    <script src="{{ url_for('static', filename='js/repartidor.js') }}"></script>

</body>

</html>
